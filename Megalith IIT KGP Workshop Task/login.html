<!-- REGISTER MODAL -->

<div
class="modal fade"
id="registerModal"
tabindex="-1">

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div class="modal-header">

<h1 class="modal-title fs-5">
Registration
</h1>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">
</button>

</div>


<div class="modal-body">

    <form id="signupForm">
<!-- <form action="#" method="post"> -->


<div class="form-floating mb-3">

<input
type="text"
class="form-control"
id="regfname"
name="fname"
placeholder="First Name"
required>

<label for="regfname">
First Name
</label>

</div>



<div class="form-floating mb-3">

<input
type="text"
class="form-control"
id="reglname"
name="lname"
placeholder="Last Name"
required>

<label for="reglname">
Last Name
</label>

</div>



<div class="form-floating mb-3">

<input
type="text"
class="form-control"
id="regcontact"
name="contact"
placeholder="Email or Phone"
required>

<label for="regcontact">
Email or Phone
</label>

</div>



<div class="form-floating mb-3">

<input
type="password"
class="form-control"
id="regpassword"
name="password"
placeholder="Password"
required>

<label for="regpassword">
Password
</label>

</div>

<div class="form-floating mb-3">

<input
type="password"
class="form-control"
id="regconfirm"

name="confirmPassword"

placeholder="Confirm Password"

required>

<label for="regconfirm">

Confirm Password

</label>

</div>


<button
type="submit"
class="btn btn-danger w-100">

Register

</button>

</form>
