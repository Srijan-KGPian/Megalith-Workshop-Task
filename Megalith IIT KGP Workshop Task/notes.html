<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Notes || Megalith IIT KGP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style_notes.css" class="style">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>


    <header class="py-3 mb-3">
        <div class="container-fluid d-grid gap-3 align-items-center" style="grid-template-columns: 1fr 2fr;">
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center col-lg-4 mb-2 mb-lg-0 link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Bootstrap menu">
                    <img src="logo.png" alt="logo" class="logo">
                </a> 
               
            </div>
            <div class="d-flex align-items-center">
                <form class="w-100 me-3" role="search" onsubmit="event.preventDefault();">
                    <input type="search" class="form-control" placeholder="Search..." aria-label="Search"> 
                </form> 
                <div class="flex-shrink-0 dropdown">
                    <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" id="profile">
                        <i class="fa-solid fa-circle-user"></i>
                    </a>
                    <ul class="dropdown-menu text-small shadow" id="header_dropdown"> 
                        <li><a class="dropdown-item feature-btn" href="#">New project...</a></li>
                        <li><a class="dropdown-item feature-btn" href="#">Settings</a></li>
                        <li><a class="dropdown-item feature-btn" href="#">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" id="logoutBtn">Log out</a></li>
                    </ul>
                </div>
            </div> 
        </div> 
    </header>





<div class="body_minus_header">

        <div class="operation_title">

    <button class="add_note" id="add_note">
        Add Note <br> +
    </button>


</div>


<div class="modal fade" id="noteModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">

        <div class="modal-content bg-dark text-light">

            <div class="modal-header">

                <textarea
                    class="form-control fs-3 bg-dark text-light border-0"
                    id="modalHeading">
                </textarea>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <textarea
                    class="form-control bg-dark text-light border-0"
                    id="modalContent"
                    style="height: 60vh;">
                </textarea>

            </div>

        </div>

    </div>

</div>


<!-- another modal for profile and other feature -->


<div class="toast-container position-fixed bottom-0 end-0 p-3">

    <div id="featureToast"
         class="toast text-bg-dark border border-danger"
         role="alert">

        <div class="d-flex">

            <div class="toast-body">
                Function not available yet 🚧
            </div>

            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast">
            </button>

        </div>

    </div>

</div>
